services:
  db:
    image: postgis/postgis:16-3.4
    container_name: airguard-postgis
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airguard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required and cannot be empty}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
